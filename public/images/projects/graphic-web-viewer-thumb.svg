<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <clipPath id="clip">
      <rect x="148" y="20" width="304" height="180" rx="12"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="600" height="220" fill="url(#bg)"/>

  <!-- Canvas shadow -->
  <rect x="152" y="24" width="304" height="180" rx="12" fill="black" fill-opacity="0.1"/>

  <!-- Viewer canvas -->
  <rect x="148" y="20" width="304" height="180" rx="12" fill="#0f172a"/>

  <!-- Subtle grid lines -->
  <g clip-path="url(#clip)" stroke="#38bdf8" stroke-width="0.5" opacity="0.12">
    <line x1="148" y1="65" x2="452" y2="65"/>
    <line x1="148" y1="110" x2="452" y2="110"/>
    <line x1="148" y1="155" x2="452" y2="155"/>
    <line x1="224" y1="20" x2="224" y2="200"/>
    <line x1="300" y1="20" x2="300" y2="200"/>
    <line x1="376" y1="20" x2="376" y2="200"/>
  </g>

  <!-- Window controls -->
  <circle cx="170" cy="38" r="4" fill="#1e3a5f"/>
  <circle cx="184" cy="38" r="4" fill="#1e3a5f"/>
  <circle cx="198" cy="38" r="4" fill="#1e3a5f"/>

  <!-- Isometric wireframe cube, centered at (300, 110) -->
  <!-- Top face -->
  <polygon points="300,58 352,84 300,110 248,84"
    fill="#38bdf8" fill-opacity="0.18"
    stroke="#38bdf8" stroke-width="1.5"
    clip-path="url(#clip)"/>
  <!-- Right face -->
  <polygon points="352,84 352,136 300,162 300,110"
    fill="#0ea5e9" fill-opacity="0.25"
    stroke="#0ea5e9" stroke-width="1.5"
    clip-path="url(#clip)"/>
  <!-- Left face -->
  <polygon points="248,84 248,136 300,162 300,110"
    fill="#7dd3fc" fill-opacity="0.12"
    stroke="#7dd3fc" stroke-width="1.5"
    clip-path="url(#clip)"/>
</svg>
