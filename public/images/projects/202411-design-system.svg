<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
<linearGradient id="titlebar" x1="0" y1="0" x2="0" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e8e8e8"/>
      <stop offset="100%" stop-color="#dedede"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#7c3aed" flood-opacity="0.22"/>
    </filter>
    <clipPath id="window-clip">
      <rect x="32" y="28" width="736" height="544" rx="12"/>
    </clipPath>
  </defs>

<!-- Window shadow -->
  <rect x="32" y="28" width="736" height="544" rx="12" fill="white" filter="url(#shadow)"/>

  <!-- Window (clipped) -->
  <g clip-path="url(#window-clip)">

    <!-- Base white -->
    <rect x="32" y="28" width="736" height="544" fill="white"/>

    <!-- macOS Title Bar -->
    <rect x="32" y="28" width="736" height="40" fill="url(#titlebar)"/>
    <rect x="32" y="68" width="736" height="1" fill="#c8c8c8"/>

    <!-- Traffic lights -->
    <circle cx="60" cy="48" r="7" fill="#ff5f57"/>
    <circle cx="80" cy="48" r="7" fill="#febc2e"/>
    <circle cx="100" cy="48" r="7" fill="#28c840"/>

    <!-- Window title -->
    <rect x="316" y="42" width="168" height="12" rx="6" fill="#888888" opacity="0.4"/>

    <!-- Sidebar -->
    <rect x="32" y="69" width="160" height="503" fill="#f2f2f7"/>
    <rect x="192" y="69" width="1" height="503" fill="#d1d1d6"/>

    <!-- Sidebar brand -->
    <rect x="48" y="84" width="16" height="16" rx="4" fill="#FF4785"/>
    <rect x="52" y="89" width="8" height="3" rx="1.5" fill="white" opacity="0.9"/>
    <rect x="52" y="95" width="5" height="3" rx="1.5" fill="white" opacity="0.6"/>
    <rect x="70" y="88" width="60" height="8" rx="4" fill="#1c1c1e"/>

    <!-- Sidebar section: Foundations -->
    <rect x="52" y="118" width="52" height="6" rx="3" fill="#aeaeb2"/>

    <!-- Colors (selected) -->
    <rect x="40" y="132" width="144" height="28" rx="7" fill="#FF4785" opacity="0.13"/>
    <rect x="56" y="141" width="38" height="7" rx="3.5" fill="#FF4785"/>

    <!-- Typography -->
    <rect x="40" y="166" width="144" height="28" rx="7" fill="transparent"/>
    <rect x="56" y="175" width="54" height="7" rx="3.5" fill="#6e6e73"/>

    <!-- Spacing -->
    <rect x="40" y="200" width="144" height="28" rx="7" fill="transparent"/>
    <rect x="56" y="209" width="44" height="7" rx="3.5" fill="#6e6e73"/>

    <!-- Shadows -->
    <rect x="40" y="234" width="144" height="28" rx="7" fill="transparent"/>
    <rect x="56" y="243" width="46" height="7" rx="3.5" fill="#6e6e73"/>

    <!-- Sidebar section: Components -->
    <rect x="52" y="278" width="62" height="6" rx="3" fill="#aeaeb2"/>

    <!-- Buttons -->
    <rect x="40" y="292" width="144" height="28" rx="7" fill="transparent"/>
    <rect x="56" y="301" width="38" height="7" rx="3.5" fill="#6e6e73"/>

    <!-- Inputs -->
    <rect x="40" y="326" width="144" height="28" rx="7" fill="transparent"/>
    <rect x="56" y="335" width="30" height="7" rx="3.5" fill="#6e6e73"/>

    <!-- Icons -->
    <rect x="40" y="360" width="144" height="28" rx="7" fill="transparent"/>
    <rect x="56" y="369" width="26" height="7" rx="3.5" fill="#6e6e73"/>

    <!-- Content Toolbar -->
    <rect x="193" y="69" width="575" height="46" fill="white"/>
    <rect x="193" y="115" width="575" height="1" fill="#f0f0f0"/>

    <!-- Breadcrumb -->
    <rect x="212" y="85" width="52" height="7" rx="3.5" fill="#FF4785"/>
    <rect x="271" y="85" width="4" height="7" rx="2" fill="#c7c7cc"/>
    <rect x="282" y="85" width="44" height="7" rx="3.5" fill="#1c1c1e"/>

    <!-- Section heading -->
    <rect x="212" y="128" width="88" height="12" rx="5" fill="#1c1c1e"/>
    <rect x="212" y="148" width="180" height="7" rx="3.5" fill="#aeaeb2"/>
    <rect x="193" y="168" width="575" height="1" fill="#f0f0f0"/>

    <!-- Brand Pink label -->
    <rect x="212" y="180" width="22" height="6" rx="3" fill="#aeaeb2"/>
    <!-- Pink swatches -->
    <rect x="212" y="192" width="50" height="44" rx="8" fill="#fff0f5"/>
    <rect x="268" y="192" width="50" height="44" rx="8" fill="#ffd6e7"/>
    <rect x="324" y="192" width="50" height="44" rx="8" fill="#FF4785"/>
    <rect x="380" y="192" width="50" height="44" rx="8" fill="#e03070"/>
    <rect x="436" y="192" width="50" height="44" rx="8" fill="#b01050"/>
    <rect x="492" y="192" width="50" height="44" rx="8" fill="#7d0836"/>

    <!-- Brand Purple label -->
    <rect x="212" y="248" width="28" height="6" rx="3" fill="#aeaeb2"/>
    <!-- Purple swatches -->
    <rect x="212" y="260" width="50" height="44" rx="8" fill="#f5f0ff"/>
    <rect x="268" y="260" width="50" height="44" rx="8" fill="#ddd6fe"/>
    <rect x="324" y="260" width="50" height="44" rx="8" fill="#c4b5fd"/>
    <rect x="380" y="260" width="50" height="44" rx="8" fill="#7c3aed"/>
    <rect x="436" y="260" width="50" height="44" rx="8" fill="#5b21b6"/>
    <rect x="492" y="260" width="50" height="44" rx="8" fill="#3b0764"/>

    <!-- Neutral label -->
    <rect x="212" y="316" width="30" height="6" rx="3" fill="#aeaeb2"/>
    <!-- Neutral swatches -->
    <rect x="212" y="328" width="40" height="40" rx="7" fill="#1a1f2e"/>
    <rect x="258" y="328" width="40" height="40" rx="7" fill="#374151"/>
    <rect x="304" y="328" width="40" height="40" rx="7" fill="#6b7280"/>
    <rect x="350" y="328" width="40" height="40" rx="7" fill="#9ca3af"/>
    <rect x="396" y="328" width="40" height="40" rx="7" fill="#d1d5db"/>
    <rect x="442" y="328" width="40" height="40" rx="7" fill="#f3f4f6"/>
    <rect x="488" y="328" width="40" height="40" rx="7" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>

    <!-- Semantic label -->
    <rect x="212" y="380" width="42" height="6" rx="3" fill="#aeaeb2"/>
    <!-- Semantic swatches -->
    <rect x="212" y="392" width="50" height="44" rx="8" fill="#10b981"/>
    <rect x="268" y="392" width="50" height="44" rx="8" fill="#f59e0b"/>
    <rect x="324" y="392" width="50" height="44" rx="8" fill="#ef4444"/>
    <rect x="380" y="392" width="50" height="44" rx="8" fill="#3b82f6"/>

    <!-- Right panel divider -->
    <rect x="590" y="168" width="1" height="396" fill="#f0f0f0"/>

    <!-- Right panel: Token detail -->
    <rect x="608" y="180" width="50" height="6" rx="3" fill="#aeaeb2"/>

    <!-- Swatch preview -->
    <rect x="608" y="196" width="152" height="52" rx="10" fill="#FF4785"/>

    <!-- Token info rows -->
    <rect x="608" y="258" width="36" height="6" rx="3" fill="#aeaeb2"/>
    <rect x="608" y="270" width="88" height="7" rx="3.5" fill="#1c1c1e"/>
    <rect x="608" y="288" width="28" height="6" rx="3" fill="#aeaeb2"/>
    <rect x="608" y="300" width="72" height="7" rx="3.5" fill="#1c1c1e"/>
    <rect x="608" y="318" width="40" height="6" rx="3" fill="#aeaeb2"/>
    <rect x="608" y="330" width="96" height="7" rx="3.5" fill="#1c1c1e"/>
    <rect x="608" y="348" width="34" height="6" rx="3" fill="#aeaeb2"/>
    <rect x="608" y="360" width="64" height="7" rx="3.5" fill="#1c1c1e"/>

    <!-- Copy button -->
    <rect x="608" y="380" width="152" height="28" rx="8" fill="#f2f2f7"/>
    <rect x="634" y="390" width="100" height="7" rx="3.5" fill="#6e6e73"/>

    <!-- Usage section -->
    <rect x="608" y="420" width="50" height="6" rx="3" fill="#aeaeb2"/>
    <rect x="608" y="434" width="152" height="22" rx="6" fill="#fff0f5"/>
    <rect x="616" y="441" width="80" height="7" rx="3.5" fill="#FF4785" opacity="0.7"/>
    <rect x="608" y="462" width="152" height="22" rx="6" fill="#f5f0ff"/>
    <rect x="616" y="469" width="68" height="7" rx="3.5" fill="#7c3aed" opacity="0.7"/>

  </g>

  <!-- Window border -->
  <rect x="32" y="28" width="736" height="544" rx="12" stroke="#00000010" stroke-width="1"/>
</svg>
